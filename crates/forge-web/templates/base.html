<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Crabforge{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/syntax-dark.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <svg width="18" height="18" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="128" cy="128" r="44"/><path d="M128 84V40M128 216v-44M84 128H24M232 128h-60"/></svg>
      crabforge
    </a>
    <nav>
      {% match viewer %}
        {% when Some with (v) %}
          <a href="/{{ v.username }}">Repositories</a>
          <form method="post" action="/logout" class="inline">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <button type="submit" class="linkish">Sign out</button>
          </form>
          <a href="/{{ v.username }}" class="monogram" title="{{ v.username }}">{{ v.initials() }}</a>
        {% when None %}
          <a href="/login">Sign in</a>
          <a href="/register" class="btn btn-secondary">Register</a>
      {% endmatch %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>Every byte of this forge lives in a crabka topic.</span>
  </footer>
</body>
</html>
