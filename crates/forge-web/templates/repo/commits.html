{% extends "layout.html" %}
{% block repo_content %}
<div class="stack">
  <div class="toolbar"><span class="revision">{{ revision }}</span></div>
  <table class="table">
    <thead><tr><th>Commit</th><th style="width:200px">Author</th><th style="width:110px">Commit id</th><th style="width:130px">When</th></tr></thead>
    <tbody>
      {% for c in commits %}
        <tr>
          <td><a class="summary" href="/{{ owner }}/{{ repo }}/commit/{{ c.oid }}">{{ c.summary }}</a></td>
          <td class="muted">{{ c.author }}</td>
          <td><code class="oid">{{ c.short }}</code></td>
          <td class="muted">{{ c.when }}</td>
        </tr>
      {% else %}
        <tr><td colspan="4" class="empty">No commits yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
