{% extends "layout.html" %}
{% block repo_content %}
<div class="toolbar"><span class="revision">{{ revision }}</span></div>
<ul class="commits">
  {% for c in commits %}
    <li>
      <a class="summary" href="/{{ owner }}/{{ repo }}/commit/{{ c.oid }}">{{ c.summary }}</a>
      <span class="meta">{{ c.author }} committed {{ c.when }}</span>
      <code class="oid">{{ c.short }}</code>
    </li>
  {% else %}
    <li class="empty">No commits yet.</li>
  {% endfor %}
</ul>
{% endblock %}
