{% extends "../repo/layout.html" %}
{% block repo_content %}
<form method="post" action="/{{ owner }}/{{ repo }}/issues" class="composer">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="text" name="title" placeholder="Title" required maxlength="255" autofocus>
  <textarea name="body" rows="10" placeholder="Describe the issue"></textarea>
  <div class="actions"><button type="submit">Open issue</button></div>
</form>
{% endblock %}
