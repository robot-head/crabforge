{% extends "../base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<form method="post" action="/login" class="auth">
  <h1>Sign in</h1>
  {% match error %}{% when Some with (e) %}<p class="error">{{ e }}</p>{% when None %}{% endmatch %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label for="username">Username</label>
    <input class="input" id="username" type="text" name="username" required autofocus autocomplete="username"></div>
  <div class="field"><label for="password">Password</label>
    <input class="input" id="password" type="password" name="password" required autocomplete="current-password"></div>
  <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  <p>No account? <a href="/register">Register</a>.</p>
</form>
{% endblock %}
