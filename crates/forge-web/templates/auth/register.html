{% extends "../base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<form method="post" action="/register" class="auth">
  <h1>Create an account</h1>
  {% match error %}{% when Some with (e) %}<p class="error">{{ e }}</p>{% when None %}{% endmatch %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label for="username">Username</label>
    <input class="input" id="username" type="text" name="username" required autofocus autocomplete="username"></div>
  <div class="field"><label for="email">Email</label>
    <input class="input" id="email" type="email" name="email" required autocomplete="email"></div>
  <div class="field"><label for="password">Password</label>
    <input class="input" id="password" type="password" name="password" required minlength="8" autocomplete="new-password"></div>
  <button type="submit" class="btn btn-primary btn-block">Register</button>
  <p>Already have one? <a href="/login">Sign in</a>.</p>
</form>
{% endblock %}
