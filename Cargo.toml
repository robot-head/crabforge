[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Crabforge Authors"]
rust-version = "1.97.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# Crabka is a ~200-crate dependency tree, and full debug info for all of it
# costs tens of gigabytes of build output for no benefit — we debug our own
# code, not the broker's. Line tables keep backtraces useful.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[workspace.dependencies]
# ── crabka (co-developed; git deps pinned by the committed Cargo.lock) ────────
#
# Crabka and Crabforge move together, so we track `main` rather than a crates.io
# release. `Cargo.lock` pins the exact rev; bump it deliberately with
# `cargo update -p crabka-client-core` and review the lockfile diff.
#
# For local co-development against an unpublished crabka change, uncomment the
# `[patch]` block at the bottom of this file and point it at your checkout.
crabka-client-admin = { git = "https://github.com/robot-head/crabka", branch = "main" }
crabka-client-consumer = { git = "https://github.com/robot-head/crabka", branch = "main" }
crabka-client-core = { git = "https://github.com/robot-head/crabka", branch = "main" }
crabka-client-producer = { git = "https://github.com/robot-head/crabka", branch = "main" }
crabka-protocol = { git = "https://github.com/robot-head/crabka", branch = "main" }
crabka-telemetry = { git = "https://github.com/robot-head/crabka", branch = "main" }
# Dev-dependency only: forge-testkit boots an in-process broker for integration
# tests. Never a runtime dependency of a forge service.
crabka-broker = { git = "https://github.com/robot-head/crabka", branch = "main" }

# ── forge crates ─────────────────────────────────────────────────────────────
forge-auth = { path = "crates/forge-auth" }
forge-bus = { path = "crates/forge-bus" }
forge-command = { path = "crates/forge-command" }
forge-events = { path = "crates/forge-events" }
forge-git = { path = "crates/forge-git" }
forge-hooks = { path = "crates/forge-hooks" }
forge-githttp = { path = "crates/forge-githttp" }
forge-projector = { path = "crates/forge-projector" }
forge-render = { path = "crates/forge-render" }
forge-store = { path = "crates/forge-store" }
forge-testkit = { path = "crates/forge-testkit" }
forge-topics = { path = "crates/forge-topics" }
forge-types = { path = "crates/forge-types" }
forge-web = { path = "crates/forge-web" }

# ── third party (versions aligned with crabka's workspace where shared) ───────
anyhow = "1"
argon2 = "0.5"
assert2 = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
derive_more = { version = "2", features = ["display", "from", "into", "as_ref", "from_str"] }
futures = "0.3"
# Entropy. `getrandom` directly rather than `rand`: the auth path needs bytes
# from the OS and nothing else, and rand's core traits have been renamed twice
# in recent releases.
getrandom = "0.4"
# Refinement types: a predicate carried in the type and enforced at
# construction. See docs/verification.md.
refinement-types = { version = "0.3", default-features = false, features = ["std"] }
flate2 = "1"
hex = "0.4"
hmac = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "charset", "http2"] }
# ── rendering ────────────────────────────────────────────────────────────────
# All of these default to oniguruma, a C library. `default-features = false`
# keeps the build pure Rust.
comrak = { version = "0.54", default-features = false }
similar = { version = "3.1", default-features = false, features = ["std", "text", "inline", "unicode"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
# syntect's bundled set has 75 grammars and lacks TypeScript, TOML, Kotlin,
# Swift, Dockerfile and more. two-face carries 213.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
# ── templating ───────────────────────────────────────────────────────────────
askama = "0.16"
# askama_axum is deprecated; askama_web is its replacement.
askama_web = { version = "0.16", features = ["axum-0.8", "tracing-0.1"] }
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "macros", "formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs", "process"] }
tokio-postgres = { version = "0.7", features = [
  "with-uuid-1",
  "with-time-0_3",
  "with-serde_json-1",
] }
toml = "1.1"
tower = "0.5"
tracing = "0.1"
# Units of measurement: byte quantities carry their unit in the type. Exact
# integer conversions, so `segment.bytes` and chunk arithmetic cannot drift.
uom = { version = "0.38", default-features = false, features = ["si", "u64", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# ── Local co-development override ────────────────────────────────────────────
#
# Uncomment and adjust the path to build against a sibling crabka checkout.
# Every crabka crate must be listed — a partial patch produces two copies of
# the client types in one binary and confusing trait-mismatch errors.
#
# [patch.'https://github.com/robot-head/crabka']
# crabka-client-admin = { path = "../crabka/crates/client-admin" }
# crabka-client-consumer = { path = "../crabka/crates/client-consumer" }
# crabka-client-core = { path = "../crabka/crates/client-core" }
# crabka-client-producer = { path = "../crabka/crates/client-producer" }
# crabka-telemetry = { path = "../crabka/crates/telemetry" }
# crabka-broker = { path = "../crabka/crates/broker" }
