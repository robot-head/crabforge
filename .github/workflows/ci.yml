name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Crabka is a git dependency tracking `main`, so this repository can break
  # without anyone here changing a line. A nightly run finds that on a schedule
  # rather than in the middle of somebody's feature.
  schedule:
    - cron: "17 4 * * *"

# A new push to a branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing here names a Rust version or a component: rust-toolchain.toml
      # pins both, and a workflow that repeated them would eventually disagree
      # with it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-lint-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    # Longer than the work deserves: one Kubernetes test waits out an
    # ImagePullBackOff on purpose, which takes minutes of doing nothing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-

      # A third of the suite runs against a real `crabka-gres`, and building it
      # means building most of crabka. Cached on the crabka revision from
      # Cargo.lock rather than on the lockfile as a whole, so bumping one of our
      # own dependencies does not throw away twenty minutes.
      - name: crabka revision
        id: crabka
        run: |
          rev=$(grep -m1 -oE 'crabka\?branch=main#[0-9a-f]+' Cargo.lock | cut -d'#' -f2)
          test -n "$rev" || { echo "no crabka revision in Cargo.lock" >&2; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: gres
        with:
          path: ~/.local/bin/crabka-gres
          key: crabka-gres-${{ steps.crabka.outputs.rev }}
      - name: build crabka-gres
        if: steps.gres.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          git clone --filter=blob:none https://github.com/robot-head/crabka /tmp/crabka
          git -C /tmp/crabka checkout --detach "${{ steps.crabka.outputs.rev }}"
          cargo build --manifest-path /tmp/crabka/Cargo.toml -p crabka-gres --bin crabka-gres
          cp /tmp/crabka/target/debug/crabka-gres ~/.local/bin/

      # So the pod-sandbox tests run rather than skip. Docker is already on the
      # runner, which is what the container-sandbox tests need.
      - name: kind cluster
        run: |
          version=$(curl -fsSL https://api.github.com/repos/kubernetes-sigs/kind/releases/latest | jq -r .tag_name)
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${version}/kind-linux-amd64"
          chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind
          kind create cluster --name crabforge-ci --wait 180s

      # No `--nocapture`. Every test that boots a broker produces pages of
      # `connection refused` as its fixture shuts down, and without capture all
      # of it lands in the log — tens of thousands of lines in which the one
      # assertion that failed is invisible. libtest prints a test's output only
      # when that test fails, which is exactly what is wanted here.
      #
      # `CRABFORGE_REQUIRE_DEPS` is how the skip guard survives that. Tests skip
      # themselves when a dependency is missing, which is right on a laptop and
      # wrong in a job that installs all of them; with this set, a skip is a
      # failure with a message naming what was missing, rather than a line in a
      # log nobody reads.
      - name: cargo test
        env:
          CRABFORGE_GRES_BIN: /home/runner/.local/bin/crabka-gres
          CRABFORGE_REQUIRE_DEPS: "1"
        run: cargo test --workspace --no-fail-fast

  manifests:
    name: deployment manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/knative/validate.sh
      - run: docker compose -f deploy/o11y/docker-compose.yml config >/dev/null

      # Validated against the real CRD schemas rather than merely parsed as
      # YAML. That distinction is what caught `KafkaNodePool.replicas` being
      # pinned to exactly 1 — a manifest that parses is not a manifest that
      # applies.
      - name: kind cluster
        run: |
          version=$(curl -fsSL https://api.github.com/repos/kubernetes-sigs/kind/releases/latest | jq -r .tag_name)
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${version}/kind-linux-amd64"
          chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind
          kind create cluster --name manifests --wait 180s
      - name: install the CRDs these manifests use
        run: |
          rev=$(grep -m1 -oE 'crabka\?branch=main#[0-9a-f]+' Cargo.lock | cut -d'#' -f2)
          git clone --filter=blob:none https://github.com/robot-head/crabka /tmp/crabka
          git -C /tmp/crabka checkout --detach "$rev"
          kubectl apply -f /tmp/crabka/deploy/crds/
          keda=$(curl -fsSL https://api.github.com/repos/kedacore/keda/releases/latest | jq -r .tag_name)
          # Server-side, because one KEDA CRD is larger than the annotation a
          # client-side apply writes to record it, and client-side fails on it.
          kubectl apply --server-side \
            -f "https://github.com/kedacore/keda/releases/download/${keda}/keda-${keda#v}.yaml"
      - name: server-side dry run
        run: |
          # The namespaces for real, because a dry run against a namespace that
          # does not exist reports only that.
          kubectl apply -f deploy/k8s/00-namespaces.yaml
          for f in deploy/k8s/*.yaml; do
            echo "== $f"
            kubectl apply --dry-run=server -f "$f"
          done
